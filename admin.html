<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClinicaFlow - Admin</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="./admin-manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"
    }
  }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="loginScreen" class="login-container">
  <div class="login-card">
    <div style="text-align:center; margin-bottom:20px;">
      <img src="img/logo-transparente.png" alt="ClinicaFlow" style="max-width:180px;">
      <h2 style="color:#1e2937; margin-top:14px;">🔐 Panel de Administrador</h2>
      <p style="color:#64748b; font-size:13px; margin-top:4px;">Acceso exclusivo para el equipo de ClinicaFlow</p>
    </div>
    <div class="form-group">
      <label>📧 Correo</label>
      <input type="email" id="adminEmail" placeholder="tu@email.com">
    </div>
    <div class="form-group">
      <label>🔒 Contraseña</label>
      <input type="password" id="adminPassword" placeholder="••••••••">
    </div>
    <button onclick="adminLogin()" class="btn-primary btn-block">Entrar</button>
  </div>
</div>

<div id="noAutorizado" style="display:none; text-align:center; margin-top:100px;">
  <h2>⛔ No autorizado</h2>
  <p style="color:#64748b; margin:15px 0;">Esta cuenta no tiene acceso al panel de administrador.</p>
  <button onclick="adminLogout()" class="btn-secondary">Cerrar sesión</button>
</div>

<div id="panelAdmin" style="display:none;" class="admin-page">
  <header class="admin-header">
    <div class="admin-header-brand">
      <img src="img/icon-transparente.png" alt="ClinicaFlow">
      <div>
        <h1>Panel de Administrador</h1>
        <p>ClinicaFlow · Gestión de usuarios y planes</p>
      </div>
    </div>
    <button onclick="adminLogout()" class="btn-secondary">🚪 Cerrar sesión</button>
  </header>

  <div class="admin-stats-grid" id="adminStatsGrid"></div>

  <div class="admin-toolbar">
    <input type="text" id="adminBuscador" class="admin-search-input" placeholder="🔍 Buscar por correo...">
    <span class="admin-count-badge" id="adminContadorResultados"></span>
  </div>

  <div id="listaUsuarios">Cargando...</div>
</div>

<script type="module" src="./src/admin.js"></script>
</body>
</html>
